# Copy to shield.yaml for automatic loading, or use --config PATH.
# Use synthetic inputs and the local fake upstream during foundation development.
upstream:
  base_url: http://127.0.0.1:8001/v1
  api_key_env: UPSTREAM_API_KEY  # The key value belongs in the environment only.
  timeout_s: 60  # Positive finite HTTP timeout, in seconds; applied by future client.

detection:
  mode: balanced  # fast=0.6 | balanced=0.5 | paranoid=0.3
  # threshold: 0.5  # An explicit value overrides the mode default.
  stage2_model: llama3.1:8b
  stage2_timeout_s: 10
  on_stage2_failure: fail_closed  # fail_closed | fail_open
  allowlist: []  # Intentional disclosures; counted separately in future reports.

vault:
  path: ~/.shield/vault.db  # Relative paths resolve beside this configuration file.
  session_ttl_hours: 24  # Only explicitly created persistent sessions.
  argon2:
    memory_kib: 65536
    time_cost: 3
    parallelism: 4

sessions:
  default: ephemeral  # Request-local memory; no vault unlock required.
  persistent_enabled: false  # Opt in to a non-echoing startup passphrase prompt.

server:
  host: 127.0.0.1  # Only this binding is supported.
  port: 8000
  max_request_bytes: 1048576  # 1 MiB; actual body bytes, before JSON parsing.
  request_timeout_s: 120  # Upload + processing until response headers are ready.

# Persistent vault passphrases are collected with a non-echoing prompt when enabled.
# Vault unlock and reusable sessions themselves are implemented in Phase 2.
# Do not put a passphrase or provider key in this file.
