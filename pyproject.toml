[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "pii-shield"
version = "0.1.0"
description = "A localhost PII shielding proxy for text-only Chat Completions."
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "argon2-cffi>=25.1,<26",
    "cryptography>=46",
    "fastapi>=0.115,<1",
    "httpx>=0.28,<1",
    "phonenumbers>=9,<10",
    "presidio-analyzer>=2.2,<3",
    "pydantic>=2.10,<3",
    "pyyaml>=6,<7",
    "regex>=2025",
    "spacy>=3.8,<3.9",
    "uvicorn>=0.34,<1",
]

[project.scripts]
pii-shield = "shield.__main__:main"

[project.optional-dependencies]
stage1 = [
    "en-core-web-lg",
]
stage2 = [
    "langchain-ollama==1.0.1",
    "langchain-core==1.8.4",
    "ollama==0.6.3",
    "langsmith==0.16.0",
]

[dependency-groups]
dev = [
    "faker>=37",
    "hypothesis>=6,<7",
    "pytest>=8.3,<10",
    "pytest-asyncio>=1,<2",
    "ruff>=0.14,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["shield"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py314"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.uv.sources]
en-core-web-lg = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_lg-3.8.0/en_core_web_lg-3.8.0-py3-none-any.whl" }
